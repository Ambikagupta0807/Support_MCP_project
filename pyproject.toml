version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ambika", email = "ambikagupta8899@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "langchain-core>=1.6.11",
    "langchain-openai>=1.7.2",
